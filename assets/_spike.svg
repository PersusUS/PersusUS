<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img"><style>
@keyframes slide { from { transform: translateX(0) } to { transform: translateX(300px) } }
.css { animation: slide 6s linear infinite }
</style><rect width="100%" height="100%" fill="#0d1117"/>
<rect class="css" x="0" y="10" width="100" height="40" fill="#e6edf3"/>
<rect x="0" y="65" width="100" height="40" fill="#8b949e"><animate attributeName="x" from="0" to="300" dur="6s" repeatCount="indefinite"/></rect>
</svg>
