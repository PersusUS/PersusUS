<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Jesus Perez Bazarot - AI/ML researcher and software engineer">
  <style>
    .bg     { fill: #000000; }
    .hair   { stroke: rgba(255,255,255,.228); fill: none; stroke-width: 1; }
    .name   { font-family: Inter, 'Segoe UI Variable Display', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; fill: #ffffff; letter-spacing: -.01em; }
    .micro  { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: .4em; text-transform: uppercase; fill: #8a8a8a; }
    .label  { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .18em; fill: #8a8a8a; }
    .read   { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Roboto Mono', monospace; font-size: 12px; letter-spacing: .06em; fill: #ffffff; }
    .body   { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #ababab; }
    .bar    { fill: #ffffff; }
    .dot    { fill: #ffffff; }
    @keyframes vol { 0%,100% { transform: scaleY(.18); } 50% { transform: scaleY(1); } }
    @keyframes blink { 0%,45% { opacity: 1; } 55%,100% { opacity: .15; } }
    .v { transform-box: fill-box; transform-origin: center; animation: vol 1.6s cubic-bezier(.4,0,.2,1) infinite; }
    .live { animation: blink 2s steps(1,end) infinite; }
  </style>

  <rect class="bg" width="1200" height="360"/>
  <rect class="hair" x="24.5" y="24.5" width="1151" height="311"/>

  <!-- top micro label -->
  <text class="micro" x="64" y="76">PERSUS &#183; COMMAND POST</text>

  <!-- live dot -->
  <circle class="dot live" cx="1136" cy="72" r="3.5"/>
  <text class="label" x="1124" y="76" text-anchor="end">LIVE</text>

  <!-- name -->
  <text class="name" x="64" y="168" font-size="56">Jes&#250;s P&#233;rez Bazarot</text>
  <text class="body" x="64" y="204">AI/ML researcher and software engineer &#183; Seville</text>
  <text class="body" x="64" y="228">World models &#183; continual learning &#183; agent systems &#183; LLMs on constrained hardware</text>

  <!-- hairline divider -->
  <path class="hair" d="M64 268 H1136"/>

  <!-- readouts -->
  <text class="label" x="64"  y="296">AFFILIATION</text>
  <text class="read"  x="64"  y="316">Universidad de Sevilla</text>
  <text class="label" x="392" y="296">SUBMITTED</text>
  <text class="read"  x="392" y="316">NeurIPS 2026 workshop</text>
  <text class="label" x="700" y="296">FOCUS</text>
  <text class="read"  x="700" y="316">Always-on assistants</text>

  <!-- voice meter, right -->
  <g transform="translate(952 268)">
    <rect class="bar v" x="0"   y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.9s"/>
    <rect class="bar v" x="12"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.2s"/>
    <rect class="bar v" x="24"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-1.3s"/>
    <rect class="bar v" x="36"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.5s"/>
    <rect class="bar v" x="48"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-1.1s"/>
    <rect class="bar v" x="60"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.3s"/>
    <rect class="bar v" x="72"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-1.7s"/>
    <rect class="bar v" x="84"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.7s"/>
    <rect class="bar v" x="96"  y="-34" width="3" height="34" rx="1.5" style="animation-delay:-1.5s"/>
    <rect class="bar v" x="108" y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.1s"/>
    <rect class="bar v" x="120" y="-34" width="3" height="34" rx="1.5" style="animation-delay:-1.0s"/>
    <rect class="bar v" x="132" y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.4s"/>
    <rect class="bar v" x="144" y="-34" width="3" height="34" rx="1.5" style="animation-delay:-1.9s"/>
    <rect class="bar v" x="156" y="-34" width="3" height="34" rx="1.5" style="animation-delay:-.6s"/>
    <rect class="bar v" x="168" y="-34" width="3" height="34" rx="1.5" style="animation-delay:-1.2s"/>
  </g>
  <text class="label" x="1136" y="316" text-anchor="end">VOICE &#183; 0.00&#8211;1.00</text>
</svg>
