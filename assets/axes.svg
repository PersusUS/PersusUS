<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Four axes: agent systems, research and ML, local-first tools, public work">
  <style>
    .bg    { fill: #000000; }
    .hair  { stroke: rgba(255,255,255,.228); fill: none; stroke-width: 1; }
    .idx   { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Roboto Mono', monospace; font-size: 10px; letter-spacing: .18em; fill: #8a8a8a; }
    .title { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; letter-spacing: .16em; text-transform: uppercase; fill: #ffffff; }
    .desc  { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #ababab; }
    .chip  { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .12em; fill: #8a8a8a; }
    .dot   { fill: #ababab; }
    .head  { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: .4em; text-transform: uppercase; fill: #8a8a8a; }
  </style>

  <rect class="bg" width="1200" height="300"/>
  <text class="head" x="64" y="44">THE FOUR AXES</text>
  <path class="hair" d="M64 60 H1136"/>

  <g>
    <circle class="dot" cx="68" cy="94" r="3.5"/>
    <text class="idx"   x="88"  y="98">01</text>
    <text class="title" x="132" y="98">Agents &amp; multi-agent systems</text>
    <text class="desc"  x="640" y="98">Perseo, MAGI, NightShift, Xana</text>
    <text class="chip"  x="1136" y="98" text-anchor="end">LONG BET</text>
    <path class="hair" d="M64 118 H1136"/>
  </g>
  <g>
    <circle class="dot" cx="68" cy="152" r="3.5"/>
    <text class="idx"   x="88"  y="156">02</text>
    <text class="title" x="132" y="156">Research &amp; ML</text>
    <text class="desc"  x="640" y="156">World models, continual learning, hybrid SSMs</text>
    <text class="chip"  x="1136" y="156" text-anchor="end">PAPERS</text>
    <path class="hair" d="M64 176 H1136"/>
  </g>
  <g>
    <circle class="dot" cx="68" cy="210" r="3.5"/>
    <text class="idx"   x="88"  y="214">03</text>
    <text class="title" x="132" y="214">Local-first tools</text>
    <text class="desc"  x="640" y="214">Runs on my machine or it does not ship</text>
    <text class="chip"  x="1136" y="214" text-anchor="end">NO CLOUD</text>
    <path class="hair" d="M64 234 H1136"/>
  </g>
  <g>
    <circle class="dot" cx="68" cy="268" r="3.5"/>
    <text class="idx"   x="88"  y="272">04</text>
    <text class="title" x="132" y="272">Public work</text>
    <text class="desc"  x="640" y="272">Portfolio, writing, open datasets</text>
    <text class="chip"  x="1136" y="272" text-anchor="end">OUTWARD</text>
  </g>
</svg>
