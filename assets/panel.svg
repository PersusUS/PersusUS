<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Readouts: 18 projects, 375 benchmark cells, 434 tests, 20785 SRS cards">
  <style>
    .bg    { fill: #000000; }
    .hair  { stroke: rgba(255,255,255,.228); fill: none; stroke-width: 1; }
    .label { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .18em; fill: #8a8a8a; }
    .fig   { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Roboto Mono', monospace; font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; fill: #ffffff; }
    .unit  { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; fill: #ababab; }
    .track { fill: rgba(255,255,255,.111); }
    .fill  { fill: #ffffff; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .fill  { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s cubic-bezier(.4,0,.2,1) both; }
  </style>

  <rect class="bg" width="1200" height="220"/>
  <rect class="hair" x="24.5" y="20.5" width="1151" height="179"/>
  <path class="hair" d="M312 20 V200 M600 20 V200 M888 20 V200"/>

  <g>
    <text class="label" x="64"  y="64">PROJECTS SHIPPED</text>
    <text class="fig"   x="64"  y="118">18</text>
    <text class="unit"  x="64"  y="142">four axes, one vault</text>
    <rect class="track" x="64" y="164" width="200" height="4" rx="2"/>
    <rect class="fill"  x="64" y="164" width="168" height="4" rx="2" style="animation-delay:.0s"/>
  </g>
  <g>
    <text class="label" x="352" y="64">BENCHMARK CELLS</text>
    <text class="fig"   x="352" y="118">375</text>
    <text class="unit"  x="352" y="142">0 NaN steps</text>
    <rect class="track" x="352" y="164" width="200" height="4" rx="2"/>
    <rect class="fill"  x="352" y="164" width="200" height="4" rx="2" style="animation-delay:.15s"/>
  </g>
  <g>
    <text class="label" x="640" y="64">TESTS GREEN</text>
    <text class="fig"   x="640" y="118">434</text>
    <text class="unit"  x="640" y="142">bit-exact reproducibility</text>
    <rect class="track" x="640" y="164" width="200" height="4" rx="2"/>
    <rect class="fill"  x="640" y="164" width="200" height="4" rx="2" style="animation-delay:.3s"/>
  </g>
  <g>
    <text class="label" x="928" y="64">SRS CARDS</text>
    <text class="fig"   x="928" y="118">20 785</text>
    <text class="unit"  x="928" y="142">the whole JLPT, offline</text>
    <rect class="track" x="928" y="164" width="200" height="4" rx="2"/>
    <rect class="fill"  x="928" y="164" width="200" height="4" rx="2" style="animation-delay:.45s"/>
  </g>
</svg>
